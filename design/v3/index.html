<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>字成画 · 动画样片</title>
<link rel="stylesheet" href="../film/fonts.css">
<style>
  :root { --bg: #161513; --fg: #d9d2c1; --dim: #8a8373; --accent: #A8322A; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.6 "Noto Sans SC", system-ui, sans-serif; }
  main { max-width: 1280px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { font-weight: 400; font-size: 20px; margin: 0 0 4px; }
  p { color: var(--dim); margin: 0 0 20px; }
  canvas#view { display: block; width: 100%; height: auto; aspect-ratio: 16 / 9; background: #0d0c0b; }
  #controls { display: flex; gap: 12px; align-items: center; margin-top: 12px; }
  button { background: none; color: var(--fg); border: 1px solid var(--dim); border-radius: 4px; padding: 4px 14px; font: inherit; cursor: pointer; }
  input[type=range] { flex: 1; accent-color: var(--accent); }
  #time { color: var(--dim); font-variant-numeric: tabular-nums; min-width: 5em; text-align: right; }
  #stills canvas { display: block; width: 100%; margin-top: 8px; }
</style>
</head>
<body>
<main>
  <h1>字成画 · 动画样片：小径分岔的花园</h1>
  <p>字墙里长出一座由字组成的迷宫。光标沿着岔路走，在岔路口停一下，把"每次开口都是重新选一次"写在路上。半分辨率预览。<span id="status">加载中……</span></p>
  <canvas id="view"></canvas>
  <div id="controls"><button id="play">暂停</button><input id="scrub" type="range" min="0" value="0"><span id="time"></span></div>
  <div id="stills"></div>
</main>
<script type="module" src="./demo.js"></script>
</body>
</html>
